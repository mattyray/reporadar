<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .card { text-align: center; color: white; }
  .icon { font-size: 72px; margin-bottom: 20px; }
  .title { font-size: 72px; font-weight: 800; letter-spacing: -2px; margin-bottom: 16px; }
  .subtitle { font-size: 28px; font-weight: 400; color: rgba(255,255,255,0.8); max-width: 700px; line-height: 1.4; margin-bottom: 24px; }
  .domain { font-size: 20px; color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128187;</div>
    <div class="title">StackJefe</div>
    <div class="subtitle">Find jobs at companies that use your tech stack</div>
    <div class="domain">stackjefe.com</div>
  </div>
</body>
</html>
